name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

env:
  MISE_LOCKED: 1

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.11  # Sync with `.config/mise.toml`•`min_version`

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - name: Audit GitHub Actions files
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:zizmor

  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Press a template
        uses: $/
        with:
          templates: tests/template.txt
          values: tests/values.yml
          output: build/hello.txt

      - name: Check what was pressed
        run: |
          cat build/hello.txt
          [[ $(<build/hello.txt) == "Hello, Bob!" ]]
