name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

env:
  MISE_LOCKED: 1

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: false  # Restored tools aren't verified, so don't cache them
          version: 2026.10.11  # Sync with `.config/mise.toml`•`min_version`

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - name: Audit GitHub Actions files
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run lint:zizmor

  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx would run a executable named `platen` in the working directory if
      # it found one, so we move into a new, empty, temporary directory first
      # to ensure we execute only the `platen` that we download.
      #
      # This fake executable ensures that we're defensive.
      - name: Plant a fake `platen`
        run: echo 'raise SystemExit("pipx ran the workspace file named platen")' > platen

      - name: Press a template
        uses: $/
        with:
          templates: tests/template.txt
          values: tests/values.yml
          output: build/hello.txt

      - name: Check what was pressed
        run: |
          cat build/hello.txt
          [[ $(<build/hello.txt) == "Hello, Bob!" ]]
