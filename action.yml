name: Press with Platen
description: >-
  Presses the values in a YAML file into a template, or into every template in
  a directory, with Platen.

inputs:
  templates:
    description: The template or directory of templates to press.
    required: true

  values:
    description: The YAML file of values to press into the templates.
    required: true

  output:
    description: The file or directory to press the templates into.
    required: true

  platen-version:
    description: The version of Platen to press with. Defaults to the latest release.
    required: false

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ">=3.14"
        update-environment: false

    - name: Press the templates
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
        PLATEN_VERSION: ${{ inputs.platen-version }}
        PYTHON: ${{ steps.python.outputs.python-path }}
        TEMPLATES: ${{ inputs.templates }}
        VALUES: ${{ inputs.values }}
      run: |
        [[ $TEMPLATES ]] || { echo "::error::The templates input is required"; exit 1; }
        [[ $VALUES ]] || { echo "::error::The values input is required"; exit 1; }
        [[ $OUTPUT ]] || { echo "::error::The output input is required"; exit 1; }

        # Make the paths absolute:
        [[ $TEMPLATES == /* ]] || TEMPLATES=$PWD/$TEMPLATES
        [[ $VALUES == /* ]] || VALUES=$PWD/$VALUES
        [[ $OUTPUT == /* ]] || OUTPUT=$PWD/$OUTPUT

        # pipx would run a executable named `platen` in the working directory if
        # it found one, so we'll move into a new, empty, temporary directory
        # first to ensure we execute only the `platen` that we download.
        empty_dir=$(mktemp -d)
        cd "$empty_dir"

        pipx                                           \
          run                                          \
          --no-cache                                   \
          --python "$PYTHON"                           \
          "platen${PLATEN_VERSION:+==$PLATEN_VERSION}" \
          --templates "$TEMPLATES"                     \
          --values    "$VALUES"                        \
          --out       "$OUTPUT"
